version: "3.8"

services:
  # Agent: runs on every GPU node, collects metrics and pushes to hub
  agent:
    image: ssubbotin/cudascope:latest
    command: ["--mode=agent", "--hub-url=http://hub:9090"]
    environment:
      # Set this to the vLLM server on the same node to have the agent scrape
      # it and push the numbers to the hub. Empty means no vLLM collection.
      - CUDASCOPE_VLLM_URL=${CUDASCOPE_VLLM_URL-}
      # Shared with the hub below. Without it the hub accepts metrics from
      # anything that can reach it on the overlay network.
      - CUDASCOPE_INGEST_TOKEN=${CUDASCOPE_INGEST_TOKEN-}
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.gpu == true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 128M
    networks:
      - cudascope

  # Hub: central server with UI and storage
  hub:
    image: ssubbotin/cudascope:latest
    command: ["--mode=hub"]
    ports:
      - "9090:9090"
    volumes:
      - cudascope-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    environment:
      - CUDASCOPE_DATA_DIR=/data
      - CUDASCOPE_INGEST_TOKEN=${CUDASCOPE_INGEST_TOKEN-}
    networks:
      - cudascope

volumes:
  cudascope-data:

networks:
  cudascope:
    driver: overlay
