services:
  cudascope:
    image: ssubbotin/cudascope:latest
    build: .
    container_name: cudascope

    # Host networking: the vLLM collector scrapes the inference server on the
    # host's own loopback, and the dashboard is served on the host's :9090.
    network_mode: host

    # NVML reports processes by their host PID. Without the host PID
    # namespace the list comes back empty and the names cannot be read
    # from /proc, which looks exactly like a GPU nobody is using.
    pid: host

    volumes:
      - cudascope-data:/data

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Paired with --collect-stall-exit-after: a collector that wedges cannot
    # be unstuck from inside, so the process exits and is brought back here.
    restart: always

    environment:
      - CUDASCOPE_DATA_DIR=/data
      # Bare "-" on purpose: with ":-" an empty value would be replaced by
      # the default too, and an empty CUDASCOPE_VLLM_URL is how vLLM
      # collection is turned off.
      - CUDASCOPE_VLLM_URL=${CUDASCOPE_VLLM_URL-http://127.0.0.1:8000}
      # Empty by default: ollama is worth watching on the hosts that run it,
      # and asking for /api/ps on a host that does not would be one failed
      # request in the log every ten seconds.
      - CUDASCOPE_OLLAMA_URL=${CUDASCOPE_OLLAMA_URL-}

volumes:
  cudascope-data:
    # Named outright: without this the volume carries the compose project
    # prefix, and an existing deployment's history is left behind.
    name: cudascope-data
